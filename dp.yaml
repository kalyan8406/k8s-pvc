apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-digimedia
  namespace: prod
  annotations: 
    kubernets.io/change-cause: "Deploy to digimedia"
spec:
  minReadySeconds: 5
  replicas: 4
  selector:
    matchLabels:
      app: digimedia-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      name: digimediapods
      labels:
        app: digimedia-app
    spec:
      containers:
        - name: digimedia-container
          image: 264786922342.dkr.ecr.ap-south-1.amazonaws.com/prod/images:digimedia
          ports:
            - containerPort: 80
          imagePullPolicy: Always  